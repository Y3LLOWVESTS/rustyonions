# RO:WHAT — Complete development/private-beta Internal ROC economics profile.
# RO:WHY — Preserves developer-friendly action prices while using the same strict schema as canonical economics.
# RO:INTERACTS — ron-policy, svc-storage paid estimates, reward planning, Omnigate, and CrabLink.
# RO:INVARIANTS — standalone profile; no inheritance or merging; integer money; exact bps totals.
# RO:METRICS — consumers may expose roc_economics_* metrics for the explicitly selected profile.
# RO:CONFIG — explicitly selected with a development economics path.
# RO:SECURITY — policy configuration only; no wallet, ledger, payout, receipt, or finality authority.
# RO:TEST — ron-policy economics profile and binding tests.

schema = "internal_roc.economics-config.v1"
version = 1
profile = "development"

[units]
money = "integer_minor_units"
minor_unit_name = "roc_minor"
minor_units_per_roc = "1000000"
basis_point_denominator = 10000

[paid_content]
minimum_price_minor = "1"

[[paid_content.default_splits]]
label = "creator"
account_role = "creator"
bps = 8500

[[paid_content.default_splits]]
label = "treasury"
account_role = "treasury"
bps = 1000

[[paid_content.default_splits]]
label = "storage_provider"
account_role = "storage_provider"
bps = 500

[paid_actions]
version = 1
unit = "roc_minor"
default_asset = "roc"
rounding = "floor"
remainder_sink = "treasury"

[paid_actions.accounts]
treasury = "t:default/treasury"
reward_pool = "t:default/reward_pool"
burn = "t:default/burn"

[paid_actions.roles]
storage_provider = "dynamic:storage_provider"
content_owner = "dynamic:content_owner"
site_owner = "dynamic:site_owner"
curator = "dynamic:curator"

[paid_actions.limits]
default_daily_spend_cap_minor = 1776
default_single_action_cap_minor = 50
anonymous_daily_spend_cap_minor = 250

# Developer beta storage price.
[paid_actions.actions.paid_storage_put]
enabled = true
pricing_kind = "flat"
price_minor = 25
minimum_charge_minor = 25
max_spend_minor = 50
max_hold_multiplier_bps = 10000

[[paid_actions.actions.paid_storage_put.splits]]
to = "storage_provider"
bps = 7000

[[paid_actions.actions.paid_storage_put.splits]]
to = "treasury"
bps = 2000

[[paid_actions.actions.paid_storage_put.splits]]
to = "reward_pool"
bps = 1000

# Developer beta pin price.
[paid_actions.actions.paid_storage_pin]
enabled = true
pricing_kind = "flat"
price_minor = 3
minimum_charge_minor = 3
max_spend_minor = 50
max_hold_multiplier_bps = 10000

[[paid_actions.actions.paid_storage_pin.splits]]
to = "storage_provider"
bps = 8000

[[paid_actions.actions.paid_storage_pin.splits]]
to = "treasury"
bps = 1000

[[paid_actions.actions.paid_storage_pin.splits]]
to = "reward_pool"
bps = 1000

# Developer beta content-view price.
[paid_actions.actions.paid_content_view]
enabled = true
pricing_kind = "flat"
price_minor = 5
minimum_charge_minor = 5
max_spend_minor = 50
max_hold_multiplier_bps = 10000

[[paid_actions.actions.paid_content_view.splits]]
to = "content_owner"
bps = 7500

[[paid_actions.actions.paid_content_view.splits]]
to = "treasury"
bps = 1500

[[paid_actions.actions.paid_content_view.splits]]
to = "reward_pool"
bps = 1000

# Developer beta song-play price.
[paid_actions.actions.paid_song_play]
enabled = true
pricing_kind = "flat"
price_minor = 8
minimum_charge_minor = 8
max_spend_minor = 50
max_hold_multiplier_bps = 10000

[[paid_actions.actions.paid_song_play.splits]]
to = "content_owner"
bps = 7000

[[paid_actions.actions.paid_song_play.splits]]
to = "curator"
bps = 1000

[[paid_actions.actions.paid_song_play.splits]]
to = "treasury"
bps = 1000

[[paid_actions.actions.paid_song_play.splits]]
to = "reward_pool"
bps = 1000

# Developer beta site-visit price.
[paid_actions.actions.site_visit]
enabled = true
pricing_kind = "flat"
price_minor = 2
minimum_charge_minor = 2
max_spend_minor = 50
max_hold_multiplier_bps = 10000

[[paid_actions.actions.site_visit.splits]]
to = "site_owner"
bps = 7000

[[paid_actions.actions.site_visit.splits]]
to = "treasury"
bps = 2000

[[paid_actions.actions.site_visit.splits]]
to = "reward_pool"
bps = 1000

# Explicit development reward-pool values.
# These are present in this file directly and are not inherited.
[reward_pools]
epoch_pool_cap_minor = "1000000"

[[reward_pools.category_caps]]
category = "creator_rewards"
pool_bps = 7000
category_cap_minor = "700000"

[[reward_pools.category_caps]]
category = "node_delivery"
pool_bps = 2000
category_cap_minor = "200000"

[[reward_pools.category_caps]]
category = "moderation"
pool_bps = 1000
category_cap_minor = "100000"

[anti_farming]
max_events_per_account_per_epoch = 1000
max_reward_minor_per_account_per_epoch = "10000"
max_reward_minor_per_content_per_epoch = "50000"

[rounding]
mode = "floor"
remainder_sink = "treasury"

[future_bridge]
enabled = false
state = "disabled_inert_placeholder"

[future_staking]
enabled = false
state = "disabled_inert_placeholder"

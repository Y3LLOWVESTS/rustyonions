# RO:WHAT — Canonical mutable internal ROC economics config for beta.
# RO:WHY — Phase 5 requires tokenomics values in one reviewed TOML source, not scattered constants.
# RO:INTERACTS — ron-proto DTOs, ron-policy validation, svc-rewarder planning, svc-wallet execution, ron-ledger truth.
# RO:INVARIANTS — integer minor-unit strings; integer bps; no floats; explicit remainder sink; bridge/staking inert.
# RO:CONFIG — This is the canonical internal ROC economics config path.
# RO:SECURITY — This file does not mint, transfer, burn, unlock, stake, bridge, settle, or create receipt truth.
# RO:TEST — Phase 5 focused tests and later ron-policy TOML validation.

schema = "internal_roc.economics-config.v1"
version = 1
profile = "canonical"

[units]
money = "integer_minor_units"
minor_unit_name = "roc_minor"
minor_units_per_roc = "1000000"
basis_point_denominator = 10000

[paid_content]
minimum_price_minor = "1"

[[paid_content.default_splits]]
label = "creator"
account_role = "creator"
bps = 8500

[[paid_content.default_splits]]
label = "treasury"
account_role = "treasury"
bps = 1000

[[paid_content.default_splits]]
label = "storage_provider"
account_role = "storage_provider"
bps = 500

[reward_pools]
epoch_pool_cap_minor = "1000000"

[[reward_pools.category_caps]]
category = "creator_rewards"
pool_bps = 7000
category_cap_minor = "700000"

[[reward_pools.category_caps]]
category = "node_delivery"
pool_bps = 2000
category_cap_minor = "200000"

[[reward_pools.category_caps]]
category = "moderation"
pool_bps = 1000
category_cap_minor = "100000"

[anti_farming]
max_events_per_account_per_epoch = 1000
max_reward_minor_per_account_per_epoch = "10000"
max_reward_minor_per_content_per_epoch = "50000"

probation_reward_cap_minor_per_node_per_epoch = "2500"
[rounding]
mode = "floor"
remainder_sink = "treasury"

[future_bridge]
enabled = false
state = "disabled_inert_placeholder"

[future_staking]
enabled = false
state = "disabled_inert_placeholder"

# Canonical paid-action economics.
# Policy configuration only; this section grants no wallet,
# ledger, payout, receipt, settlement, or finality authority.
[paid_actions]
# RO:WHAT — Legacy paid-action economics fixture for ron-policy regression tests.
# RO:WHY — Preserves the pre-Phase-5 paid-action EconomicsPolicy test shape after configs/roc-economics.toml became the canonical Internal ROC Phase 5 tokenomics config.
# RO:INTERACTS — crates/ron-policy/tests/economics_policy.rs and older QuickChain economics non-authority regressions.
# RO:INVARIANTS — fixture only; integer minor units; basis points sum to 10000; no wallet/ledger authority.
# RO:SECURITY — no receipts, balances, finality, bridge, staking, liquidity, or external settlement.

version = 1
unit = "roc_minor"
default_asset = "roc"
rounding = "floor"
remainder_sink = "treasury"

[paid_actions.accounts]
treasury = "t:default/treasury/w"
protocol = "t:default/protocol/w"
creator = "t:default/creator/w"
moderation_reserve = "t:default/moderation/w"

[paid_actions.roles]
storage_provider = "dynamic:storage_provider"
content_owner = "dynamic:content_owner"

[paid_actions.limits]
default_daily_spend_cap_minor = 1000000
default_single_action_cap_minor = 100000
anonymous_daily_spend_cap_minor = 10000

[paid_actions.actions.paid_storage_put]
enabled = true
pricing_kind = "per_byte_plus_minimum"
price_per_byte_minor = 1
minimum_charge_minor = 70
max_spend_minor = 100000
max_hold_multiplier_bps = 12000

[[paid_actions.actions.paid_storage_put.splits]]
to = "storage_provider"
bps = 9500

[[paid_actions.actions.paid_storage_put.splits]]
to = "treasury"
bps = 500

[paid_actions.actions.paid_storage_pin]
enabled = true
pricing_kind = "flat"
price_minor = 25
minimum_charge_minor = 25
max_spend_minor = 100000
max_hold_multiplier_bps = 10000

[[paid_actions.actions.paid_storage_pin.splits]]
to = "storage_provider"
bps = 8500

[[paid_actions.actions.paid_storage_pin.splits]]
to = "treasury"
bps = 1500

[paid_actions.actions.paid_content_view]
enabled = true
pricing_kind = "flat"
price_minor = 5
minimum_charge_minor = 5
max_spend_minor = 100000
max_hold_multiplier_bps = 10000

[[paid_actions.actions.paid_content_view.splits]]
to = "content_owner"
bps = 9000

[[paid_actions.actions.paid_content_view.splits]]
to = "treasury"
bps = 1000

[paid_actions.actions.paid_song_play]
enabled = true
pricing_kind = "per_second_plus_minimum"
price_per_second_minor = 1
minimum_charge_minor = 30
max_spend_minor = 100000
max_hold_multiplier_bps = 10000

[[paid_actions.actions.paid_song_play.splits]]
to = "content_owner"
bps = 9000

[[paid_actions.actions.paid_song_play.splits]]
to = "treasury"
bps = 1000

[paid_actions.actions.site_visit]
enabled = true
pricing_kind = "flat"
price_minor = 3
minimum_charge_minor = 3
max_spend_minor = 100000
max_hold_multiplier_bps = 10000

[[paid_actions.actions.site_visit.splits]]
to = "content_owner"
bps = 9000

[[paid_actions.actions.site_visit.splits]]
to = "treasury"
bps = 1000
